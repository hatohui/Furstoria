version: "3"

vars:
  DOPPLER_RUN: '"{{.DOPPLER_BIN}}" run --project furstoria --config tf --name-transformer tf-var --'

tasks:
  init:
    desc: "Run terraform init"
    dir: infra
    cmds:
      - terraform init

  plan:
    desc: "Run terraform plan"
    dir: infra
    cmds:
      - "{{.DOPPLER_RUN}} terraform plan"

  apply:
    desc: "Run terraform apply"
    dir: infra
    cmds:
      - "{{.DOPPLER_RUN}} terraform apply -auto-approve"

  output:
    desc: "Run terraform output"
    dir: infra
    cmds:
      - "{{.DOPPLER_RUN}} terraform output"
